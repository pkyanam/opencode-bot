name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned runner and native CLI
        run: npm ci --prefix runner

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web assets
        run: npm run build
