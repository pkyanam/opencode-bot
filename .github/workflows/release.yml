name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing v*.*.* tag to release
        required: true
        type: string
      ref:
        description: Commit or ref to check out (defaults to version)
        required: false
        type: string
permissions:
  contents: read
env:
  NODE_VERSION: 24
  OPENCODE_VERSION: 2.0.11
  SANDBOX_VERSION: 0.12.9
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'preethamk' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check publishing credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$DOCKERHUB_TOKEN" || { echo "Add DOCKERHUB_TOKEN in repository Actions secrets before releasing" >&2; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || inputs.version) || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix runner
      - run: npm ci --prefix apps/mobile
      - run: npm run typecheck --prefix apps/mobile
      - name: Verify mobile bundles
        working-directory: apps/mobile
        run: |
          npx expo export --platform ios
          npx expo export --platform android
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      image: ${{ steps.reuse.outputs.image || steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || inputs.version) || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build
      - id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          commit=$(git rev-parse HEAD)
          scripts/release/verify-source.sh "$tag" "$commit"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - id: image-source
        name: Fingerprint Computer image inputs
        run: echo "fingerprint=$(node scripts/release/image-fingerprint.mjs)" >> "$GITHUB_OUTPUT"
      - id: reuse
        name: Reuse unchanged published Computer image
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_FINGERPRINT: ${{ steps.image-source.outputs.fingerprint }}
        run: |
          set -euo pipefail
          previous_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // empty')
          if [[ -z "$previous_tag" ]]; then
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .tmp/previous-release
          if ! gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir .tmp/previous-release; then
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous_fingerprint=$(jq -r '.image.fingerprint // empty' .tmp/previous-release/release-manifest.json)
          previous_image=$(jq -r '.image.reference // empty' .tmp/previous-release/release-manifest.json)
          if [[ "$previous_fingerprint" == "$CURRENT_FINGERPRINT" && "$previous_image" =~ ^docker\.io/[a-z0-9._-]+/[a-z0-9._-]+@sha256:[0-9a-f]{64}$ ]] && docker manifest inspect "$previous_image" >/dev/null 2>&1; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "image=$previous_image" >> "$GITHUB_OUTPUT"
            echo "digest=${previous_image##*@}" >> "$GITHUB_OUTPUT"
            echo "Reusing $previous_image (fingerprint $CURRENT_FINGERPRINT)"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
        if: steps.reuse.outputs.reuse != 'true'
      - name: Build linux/amd64 image
        if: steps.reuse.outputs.reuse != 'true'
        run: >-
          docker buildx build --platform linux/amd64 --file images/computer/Dockerfile
          --tag opencode-bot:release --metadata-file image-metadata.json
          --cache-from type=registry,ref=docker.io/$DOCKERHUB_USERNAME/opencode-bot:buildcache
          --cache-to type=inline
          --load .
      - name: Smoke test image
        if: steps.reuse.outputs.reuse != 'true'
        run: scripts/release/smoke-image.sh opencode-bot:release "$OPENCODE_VERSION" "$SANDBOX_VERSION"
      - name: Smoke test runner health
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          docker run --rm -d --name opencode-release-smoke -p 8787:8787 \
            -e RUNNER_TOKEN=release-smoke-token --entrypoint /bin/sh opencode-bot:release \
            -ceu 'node /opt/opencode-bot/runner/server.mjs'
          trap 'docker rm -f opencode-release-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8787/health && exit 0
            sleep 1
          done
          docker logs opencode-release-smoke
          exit 1
      - name: Publish image to Docker Hub
        id: push
        if: steps.reuse.outputs.reuse != 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_TOKEN" || { echo 'DOCKERHUB_TOKEN is required; add it in repository Settings > Secrets and variables > Actions' >&2; exit 1; }
          repo="docker.io/$DOCKERHUB_USERNAME/opencode-bot"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          docker tag opencode-bot:release "$repo:$RELEASE_TAG"
          docker tag opencode-bot:release "$repo:$RELEASE_COMMIT"
          docker tag opencode-bot:release "$repo:buildcache"
          docker push "$repo:$RELEASE_TAG"
          docker push "$repo:$RELEASE_COMMIT"
          docker push "$repo:buildcache"
          digest=$(docker buildx imagetools inspect "$repo:$RELEASE_TAG" | awk '/Digest:/ { print $2; exit }')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Docker Hub did not return an immutable digest" >&2; exit 1; }
          reference="$repo@$digest"
          echo "image=$reference" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker logout docker.io
          # Verify installers can pull without our publishing credentials.
          docker buildx imagetools inspect "$reference" >/dev/null
      - name: Write release manifest
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          IMAGE_REFERENCE: ${{ steps.reuse.outputs.image || steps.push.outputs.image }}
          IMAGE_DIGEST: ${{ steps.reuse.outputs.digest || steps.push.outputs.digest }}
          BUILD_DIGEST: ${{ steps.reuse.outputs.digest || steps.push.outputs.digest }}
          IMAGE_FINGERPRINT: ${{ steps.image-source.outputs.fingerprint }}
        run: |
          rm -rf .tmp/node-bundle node-bundle.tar.gz
          mkdir -p .tmp/node-bundle/scripts .tmp/node-bundle/runner .tmp/node-bundle/packages/runtime-opencode2/src .tmp/node-bundle/packages/browser/src
          cp scripts/node-agent.mjs .tmp/node-bundle/scripts/node-agent.mjs
          cp scripts/node-update.mjs .tmp/node-bundle/scripts/node-update.mjs
          cp scripts/node-model-readiness.mjs scripts/node-transfer.mjs .tmp/node-bundle/scripts/
          cp runner/*.mjs runner/package.json runner/package-lock.json .tmp/node-bundle/runner/
          cp packages/runtime-opencode2/src/client.mjs .tmp/node-bundle/packages/runtime-opencode2/src/client.mjs
          cp packages/browser/src/index.ts .tmp/node-bundle/packages/browser/src/index.ts
          tar -czf node-bundle.tar.gz -C .tmp/node-bundle .
          rm -rf .tmp/node-smoke
          mkdir -p .tmp/node-smoke
          tar -xzf node-bundle.tar.gz -C .tmp/node-smoke
          npm ci --prefix .tmp/node-smoke/runner --omit=dev --no-audit --fund=false
          ln -s runner/node_modules .tmp/node-smoke/node_modules
          OPENCODE_BOT_DESKTOP=0 RUNNER_TOKEN=release-node-smoke RUNTIME_ROOT="$PWD/.tmp/node-smoke/state" WORKSPACE_DIRECTORY="$PWD/.tmp/node-smoke/workspace" node .tmp/node-smoke/runner/server.mjs >.tmp/node-smoke.log 2>&1 &
          node_pid=$!
          trap 'kill "$node_pid" 2>/dev/null || true' EXIT
          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health; then healthy=true; break; fi
            sleep 1
          done
          "$healthy" || { cat .tmp/node-smoke.log; exit 1; }
          kill "$node_pid" 2>/dev/null || true
          grep -q 'runner listening' .tmp/node-smoke.log || { cat .tmp/node-smoke.log; exit 1; }
          node scripts/release/write-node-manifest.mjs --output node-bundle-manifest.json \
            --version "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --archive node-bundle.tar.gz
          node scripts/release/build-bundle.mjs \
            --version "$RELEASE_TAG" --commit "$RELEASE_COMMIT" \
            --image-reference "$IMAGE_REFERENCE" --image-digest "$BUILD_DIGEST" --image-fingerprint "$IMAGE_FINGERPRINT"
          node scripts/release/write-manifest.mjs --output release-manifest.json \
            --version "$RELEASE_TAG" --commit "$RELEASE_COMMIT" \
            --digest "$BUILD_DIGEST" --reference "$IMAGE_REFERENCE" --image-fingerprint "$IMAGE_FINGERPRINT" --bundle .tmp/update-bundle/app-bundle.json
          cp .tmp/update-bundle/app-bundle.json app-bundle.json
          sha256sum release-manifest.json app-bundle.json node-bundle-manifest.json node-bundle.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: release-bundle
          retention-days: 3
          path: |
            release-manifest.json
            app-bundle.json
            node-bundle-manifest.json
            node-bundle.tar.gz
            SHA256SUMS
          if-no-files-found: error
  publish:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-bundle
      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.image.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.image.outputs.commit }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            test "$draft" = true || { echo "release $RELEASE_TAG already exists and is published" >&2; exit 1; }
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber release-manifest.json app-bundle.json node-bundle-manifest.json node-bundle.tar.gz SHA256SUMS
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" \
              --generate-notes --draft release-manifest.json app-bundle.json node-bundle-manifest.json node-bundle.tar.gz SHA256SUMS
          fi
      - name: Publish release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.image.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
